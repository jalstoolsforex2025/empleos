@keyframes swing {
  15% { transform: rotate(15deg); }
  30% { transform: rotate(-10deg); }
  45% { transform: rotate(5deg); }
  60% { transform: rotate(-5deg); }
  75% { transform: rotate(2deg); }
  100% { transform: rotate(0deg); }
}
.animate-swing {
  animation: swing 1s ease;
  transform-origin: top center;
}
.text-shadow-md {
    text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.4);
}
@keyframes fade-in-down-fast {
  from { opacity: 0; transform: translateY(-10px); }
  to { opacity: 1; transform: translateY(0); }
}
.animate-fade-in-down-fast {
    animation: fade-in-down-fast 0.2s ease-out;
}
@keyframes fade-in-fast {
  from { opacity: 0; transform: translateY(5px); }
  to { opacity: 1; transform: translateY(0); }
}
.animate-fade-in-fast {
  animation: fade-in-fast 0.3s ease-out forwards;
}
@keyframes slide-in-up {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
.animate-slide-in-up {
  animation: slide-in-up 0.5s ease-out backwards;

@keyframes fade-in {

@keyframes fade-out-down {

    transform: translateY(0);
  }

    transform: translateY(20px);
  }
}

  animation: fade-out-down 0.5s ease-out forwards;
}

  from { width: 0%; }

@keyframes blink-cursor {
  from, to { border-color: transparent; }
  50% { border-color: #f58220; }
}
.typing-cursor {
  display: inline-block;
  width: 1px;
  height: 1em;
  border-right: 2px solid #f58220;
  animation: blink-cursor 0.75s step-end infinite;
}
.mouse-cursor {
  position: absolute;
  z-index: 9999;
  pointer-events: none;
  transition: top 0.6s ease-in-out, left 0.6s ease-in-out;
}

  0% { transform: scale(1); }
  50% { transform: scale(0.8); }

}
@keyframes draw-underline {
    from {
        width: 0;
        opacity: 0;
    }
    to {
        width: 100px;
        opacity: 1;
    }
}
.animate-draw-underline {
    animation: draw-underline 0.8s cubic-bezier(0.65, 0, 0.35, 1) forwards;

@keyframes briefcase-fade-in {
  0% { opacity: 0; transform: scale(0.8); }
  50% { opacity: 1; transform: scale(1.05); }
  100% { opacity: 0.8; transform: scale(1); }
}
.animate-briefcase-fade-in {
  animation: briefcase-fade-in 6s infinite cubic-bezier(0.4, 0, 0.6, 1);
